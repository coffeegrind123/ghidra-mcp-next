name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
      - run: uv run ruff check packages/ tests/
      - run: uv run ruff format --check packages/ tests/

  reuse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: fsfe/reuse-action@v5

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
      - run: uv run pytest

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
      - run: uv build --all-packages

  # The server against a real Ghidra: transactions, rollback, undo, save,
  # projects. tests/live is skipped in the plain test job (no Ghidra there).
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - ghidra: "12.0.3"
            zip: ghidra_12.0.3_PUBLIC_20260210.zip
            java: "21"
          - ghidra: "12.1.4"
            zip: ghidra_12.1.4_PUBLIC_20260921.zip
            java: "21"
          - ghidra: "12.2"
            zip: ghidra_12.2_PUBLIC_20261016.zip
            java: "25"
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Cache Ghidra
        id: ghidra-cache
        uses: actions/cache@v4
        with:
          path: ~/ghidra
          key: ghidra-${{ matrix.ghidra }}
      - name: Download Ghidra ${{ matrix.ghidra }}
        if: steps.ghidra-cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o /tmp/ghidra.zip \
            "https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_${{ matrix.ghidra }}_build/${{ matrix.zip }}"
          mkdir -p ~/ghidra && unzip -q /tmp/ghidra.zip -d ~/ghidra
      - name: Live tests
        env:
          RE_MCP_LOG_DIR: ${{ runner.temp }}/worker-logs
          GHIDRA_MCP_LOG_LEVEL: INFO
          RE_MCP_LOG_LEVEL: INFO
          # A worker whose call runs 5 minutes dumps its Python and Java stacks to its log.
          GHIDRA_MCP_STALL_DUMP_S: "300"
        run: |
          export GHIDRA_INSTALL_DIR="$(ls -d ~/ghidra/ghidra_*_PUBLIC)"
          mkdir -p "$RE_MCP_LOG_DIR"
          # A hang leaves nothing in the log before the job timeout cancels it.
          # At 12 minutes (a full run takes about 6), dump the processes, the Python stacks and the
          # tail of each worker's stderr, while the processes still exist.
          (
            uv tool install -q py-spy >/dev/null 2>&1 || true
            sleep 720
            echo "::group::hang diagnostics"
            free -m
            ps -eo pid,ppid,rss,etimes,stat,args --sort=pid | cut -c1-220
            sudo dmesg -T | grep -iE "killed process|out of memory|oom" | tail -n 20 || true
            # Workers run as "python -m re_mcp_ghidra.server".
            for pid in $(pgrep -f 're-mcp-ghidra|re_mcp_ghidra.server|pytest'); do
              echo "== py-spy $pid"
              sudo "$HOME/.local/bin/py-spy" dump --pid "$pid" || true
            done
            for f in "$RE_MCP_LOG_DIR"/*; do echo "== $f"; tail -n 400 "$f"; done
            echo "::endgroup::"
          ) &
          uv run pytest tests/live -m live -v
      - name: Upload worker logs
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: worker-logs-${{ matrix.ghidra }}
          path: ${{ runner.temp }}/worker-logs
