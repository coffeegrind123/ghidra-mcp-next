version = 1

[[annotations]]
path = [
    "pyproject.toml",
    "packages/*/pyproject.toml",
    "uv.lock",
    ".python-version",
    ".gitignore",
    ".mcp.json",
    ".pre-commit-config.yaml",
    ".github/**",
    "packages/*/src/*/py.typed",
    "README.md",
    "packages/*/README.md",
    "CLAUDE.md",
    "docs/**",
]
